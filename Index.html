<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Balloon</title>

    https://aframe.io/releases/1.4.2/aframe.min.jsscript>
    https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.jsscript>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 999;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
        }

        #boostBtn {
            background: #ff9800;
        }

        #explodeBtn {
            background: #f44336;
        }
    </style>
</head>

<body>

<div class="controls">
    <button id="boostBtn">🚀 เร่งไฟ</button>
    <button id="explodeBtn">💥 ระเบิด</button>
</div>

<a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Marker Hiro -->
    <a-marker preset="hiro">

        <!-- บอลลูน -->
        <a-sphere
            id="balloon"
            position="0 1 0"
            radius="0.3"
            color="#ff4da6">
        </a-sphere>

        <!-- เชือก -->
        <a-cylinder
            position="0 0.4 0"
            radius="0.01"
            height="0.8"
            color="white">
        </a-cylinder>

        <!-- ไฟ -->
        <a-cone
            id="flame"
            position="0 0.1 0"
            radius-bottom="0.08"
            radius-top="0"
            height="0.2"
            color="orange"
            visible="false">
        </a-cone>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

<script>

const balloon = document.querySelector('#balloon');
const flame = document.querySelector('#flame');

let altitude = 1;
let boostActive = false;

function floatBalloon() {

    if (boostActive) {
        altitude += 0.05;
    } else {
        altitude += 0.01;
    }

    balloon.setAttribute(
        'position',
        `0 ${altitude} 0`
    );

    flame.setAttribute(
        'position',
        `0 ${altitude-0.9} 0`
    );

    requestAnimationFrame(floatBalloon);
}

floatBalloon();

document.getElementById('boostBtn')
.addEventListener('click', () => {

    boostActive = true;
    flame.setAttribute('visible', true);

    setTimeout(() => {
        boostActive = false;
        flame.setAttribute('visible', false);
    }, 3000);

});

document.getElementById('explodeBtn')
.addEventListener('click', () => {

    balloon.setAttribute('color', 'red');

    let size = 0.3;

    const explode = setInterval(() => {

        size += 0.08;

        balloon.setAttribute('radius', size);

        if(size >= 0.8){

            clearInterval(explode);

            balloon.setAttribute('visible', false);

            flame.setAttribute('visible', false);

            alert('💥 บอลลูนระเบิด!');

            setTimeout(() => {

                altitude = 1;

                balloon.setAttribute('radius', 0.3);
                balloon.setAttribute('visible', true);
                balloon.setAttribute('color', '#ff4da6');

            }, 1000);

        }

    }, 50);

});

</script>

</body>
</html>
